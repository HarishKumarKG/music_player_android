# Continuous integration: every push to main (and every pull request into main)
# runs the unit tests and builds the app. A failure shows a red ✗ on the commit.
# The built debug APK is kept as a downloadable artifact for 14 days.
name: CI

on:
  push:
    # branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running build
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build debug APK
        env:
          VERSION_NAME: 0.0.0-ci.${{ github.run_number }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Harish-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test report (when tests fail)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ github.run_number }}
          path: app/build/reports/tests/
          retention-days: 14
