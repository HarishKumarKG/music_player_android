# Builds a signed release APK + AAB.
#  - Push a tag like v1.2.0 (or create a Release on GitHub with a new v-tag) -> builds and attaches
#    the files to that GitHub Release.
#  - "Run workflow" button on the Actions tab -> builds and keeps the files as a downloadable artifact.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Work out version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"          # v1.2.0 -> 1.2.0
          else
            NAME="0.0.0-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build signed APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Harish-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/Harish-${{ steps.version.outputs.name }}.aab"
          ls -l dist

      - name: Keep files as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Harish-${{ steps.version.outputs.name }}
          path: dist/*

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
